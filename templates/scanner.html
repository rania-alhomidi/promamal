{% extends 'base.html' %}
{% block title %}ماسح QR{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="card shadow-sm rounded-4">
      <div class="card-body">
        <h3 class="mb-3">ماسح QR للطلاب</h3>
        <p class="text-muted">امسح رمز الطالب مباشرة لفتح ملفه وتقييمه.</p>

        <div id="reader" style="width: 100%; max-width: 500px; margin: 0 auto;"></div>
        <div id="scan-status" class="mt-3 text-center text-muted"></div>
      </div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/html5-qrcode@2.3.8/minified/html5-qrcode.min.js"></script>
<script>
  const qrReader = new Html5Qrcode("reader");
  const status = document.getElementById('scan-status');

  Html5Qrcode.getCameras().then(devices => {
    if (devices && devices.length) {
      const cameraId = devices[0].id;
      qrReader.start(
        cameraId,
        { fps: 10, qrbox: { width: 250, height: 250 } },
        (decodedText) => {
          status.textContent = 'تم مسح الكود بنجاح';
          setTimeout(() => {
            window.location.href = '/scan/' + encodeURIComponent(decodedText);
          }, 800);
        },
        (errorMessage) => {
          // ignored, scanner keeps running
        }
      ).catch(err => {
        status.textContent = 'تعذر فتح الكاميرا. تأكد من السماح بالوصول.';
      });
    } else {
      status.textContent = 'لا توجد كاميرا متاحة في هذا الجهاز.';
    }
  }).catch(err => {
    status.textContent = 'تعذر الوصول إلى الكاميرات.';
  });
</script>
{% endblock %}
