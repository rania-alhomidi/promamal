{% extends 'base.html' %}
{% block title %}ماسح QR{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="card shadow-sm rounded-4 scanner-card">
      <div class="card-body text-center">
        <h3 class="mb-3">ماسح QR للطلاب</h3>
        <p class="text-muted mb-3">امسح رمز الطالب مباشرة من داخل الموقع، وسيتم فتح صفحة الطالب تلقائياً.</p>

        <button id="start-scan" class="btn btn-primary mb-3">فتح الكاميرا وبدء المسح</button>
        <div id="reader" class="scanner-reader"></div>
        <div id="scan-status" class="mt-3 text-center text-muted"></div>
      </div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/html5-qrcode@2.3.8/minified/html5-qrcode.min.js"></script>
<style>
  .scanner-card {
    max-width: 700px;
    margin: 0 auto;
  }

  .scanner-reader {
    width: 100%;
    max-width: 500px;
    margin: 0 auto;
    min-height: 320px;
    border-radius: 18px;
    overflow: hidden;
    background: #111;
  }

  #reader video {
    width: 100% !important;
    height: auto !important;
    max-height: 420px;
    border-radius: 18px;
    object-fit: cover;
  }

  @media (max-width: 767px) {
    .scanner-reader {
      min-height: 260px;
    }

    #start-scan {
      width: 100%;
    }
  }
</style>

<script>
  const status = document.getElementById('scan-status');
  const startBtn = document.getElementById('start-scan');
  const readerElement = document.getElementById('reader');
  let qrReader = null;
  let scannerLocked = false;

  function normalizeQrText(rawText) {
    let value = (rawText || '').trim();
    if (!value) return '';

    value = value.replace(/^"|"$/g, '').replace(/^'|'$/g, '');

    if (value.includes('://')) {
      try {
        const url = new URL(value);
        const pathParts = url.pathname.split('/').filter(Boolean);
        if (pathParts.includes('scan')) {
          const index = pathParts.indexOf('scan');
          if (index >= 0 && pathParts[index + 1]) {
            return pathParts[index + 1];
          }
        }
        if (pathParts.includes('student')) {
          const index = pathParts.indexOf('student');
          if (index >= 0 && pathParts[index + 1] && /^\d+$/.test(pathParts[index + 1])) {
            return pathParts[index + 1];
          }
        }
      } catch (e) {
        // ignore invalid URL and fall back to raw value
      }
    }

    if (value.includes('/scan/')) {
      return value.split('/scan/').pop().split('?')[0];
    }

    if (value.includes('/student/')) {
      const suffix = value.split('/student/').pop().split('?')[0];
      if (/^\d+$/.test(suffix)) return suffix;
    }

    return value;
  }

  function redirectFromQr(decodedText) {
    if (scannerLocked) return;
    scannerLocked = true;

    const qrCode = normalizeQrText(decodedText);
    if (!qrCode) {
      status.textContent = 'تم قراءة بيانات غير صالحة.';
      scannerLocked = false;
      return;
    }

    status.textContent = 'تم مسح الكود بنجاح...';

    setTimeout(() => {
      const target = '/scan/' + encodeURIComponent(qrCode);
      window.location.href = target;
    }, 700);
  }

  async function startScanner() {
    const isSecure = window.isSecureContext || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
    if (!isSecure) {
      status.textContent = 'يجب فتح الموقع عبر HTTPS أو localhost حتى تعمل الكاميرا.';
      return;
    }

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      status.textContent = 'المتصفح لا يدعم الكاميرا في هذا الجهاز.';
      return;
    }

    startBtn.disabled = true;
    status.textContent = 'جاري فتح الكاميرا...';

    try {
      const devices = await Html5Qrcode.getCameras();
      if (!devices || devices.length === 0) {
        status.textContent = 'لا توجد كاميرا متاحة في هذا الجهاز.';
        startBtn.disabled = false;
        return;
      }

      const cameraId = devices[0].id;

      if (!qrReader) {
        qrReader = new Html5Qrcode('reader');
      }

      await qrReader.start(
        cameraId,
        {
          fps: 10,
          qrbox: { width: 260, height: 260 },
          aspectRatio: 1.2,
          disableFlip: false,
          videoConstraints: {
            facingMode: { ideal: 'environment' }
          }
        },
        (decodedText) => redirectFromQr(decodedText),
        (errorMessage) => {
          // ignore frame errors while scanning
        }
      );

      status.textContent = 'وجه الكاميرا نحو رمز الطالب...';
    } catch (error) {
      status.textContent = 'تعذر فتح الكاميرا. تأكد من إعطاء الصلاحية للمتصفح أو استخدم متصفح يدعم الوصول إلى الكاميرا.';
      startBtn.disabled = false;
    }
  }

  startBtn.addEventListener('click', startScanner);
</script>
{% endblock %}
